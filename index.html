<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyEarn - Login & Signup</title>
    <style>
        :root { --primary-blue: #1e3a8a; --accent-green: #10b981; --bg-dark: #0f172a; --text-light: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #1e293b; border-radius: 20px; padding: 30px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 15px 30px rgba(0,0,0,0.4); border: 1px solid rgba(30, 58, 138, 0.4); }
        .logo h1 { font-size: 32px; margin: 0 0 5px 0; }
        .logo h1 span { color: var(--accent-green); }
        input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; box-sizing: border-box; font-weight: bold; }
        input { background: #0f172a; border: 1px solid #475569; color: white; }
        button.btn-submit { background: var(--accent-green); color: #0f172a; border: none; cursor: pointer; }
        button.btn-google { background: white; color: black; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .divider { margin: 20px 0; color: #64748b; font-size: 12px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo"><h1>Study<span>Earn</span></h1></div>
    <p style="color: #94a3b8; font-size: 13px;">क्विज़ खेलें और 2-Tier टीम कमीशन कमाएं।</p>
    
    <input type="email" id="emailInput" placeholder="आपका ईमेल पता">
    <input type="password" id="passInput" placeholder="पासवर्ड (कम से कम 6 अक्षर)">
    <button class="btn-submit" onclick="handleEmailAuth()">ईमेल से शुरू करें (Login/Signup)</button>

    <div class="divider">अथवा</div>

    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/copy_of_24dp.png" width="20" alt="Google">
        Google से लॉगिन करें
    </button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
