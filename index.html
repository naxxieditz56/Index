<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyEarn - Welcome</title>
    <style>
        :root { --primary-blue: #1e3a8a; --accent-green: #10b981; --bg-dark: #0f172a; --text-light: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e293b; border-radius: 20px; padding: 40px 30px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 15px 30px rgba(0,0,0,0.4); border: 1px solid rgba(30, 58, 138, 0.4); }
        .logo h1 { font-size: 32px; margin: 0 0 10px 0; }
        .logo h1 span { color: var(--accent-green); }
        .tagline { color: #94a3b8; font-size: 14px; margin-bottom: 35px; }
        .btn-google { background: #ffffff; color: #1f2937; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .btn-google:hover { background: #f3f4f6; transform: translateY(-2px); }
        .btn-google img { width: 22px; height: 22px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo"><h1>Study<span>Earn</span></h1></div>
    <p class="tagline">क्विज़ खेलें, ज्ञान बढ़ाएं और हर रेफरल पर लाइफटाइम कमीशन कमाएं।</p>
    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/copy_of_24dp.png" alt="Google">
        Google के साथ शुरू करें
    </button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
