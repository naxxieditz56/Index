<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyEarn - Admin Panel</title>
    <style>
        :root { --primary-blue: #1e3a8a; --accent-green: #10b981; --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; }
        h1 { color: var(--accent-green); border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; box-sizing: border-box; }
        input { background: #0f172a; border: 1px solid #475569; color: white; }
        button { background: var(--primary-blue); color: white; border: none; font-weight: bold; cursor: pointer; }
        button.danger { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: var(--accent-green); }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>StudyEarn कंट्रोल एडमिन पैनल ⚙️</h1>
    
    <div class="grid">
        <div class="card">
            <h3>➕ नया टास्क जोड़ें</h3>
            <input type="text" id="taskTitle" placeholder="टास्क का नाम (e.g. वीडियो वॉच टास्क)">
            <input type="number" id="taskReward" placeholder="रिवॉर्ड अमाउंट (रुपये में)">
            <button onclick="addNewTask()">टास्क लाइव करें</button>
        </div>

        <div class="card">
            <h3>✏️ यूजर वॉलेट कंट्रोल</h3>
            <input type="text" id="targetUserId" placeholder="यूजर की UID">
            <input type="number" id="newBalance" placeholder="नया बैलेंस सेट करें">
            <button onclick="updateUserBalanceAdmin()">बैलेंस अपडेट करें</button>
        </div>
    </div>

    <div class="card">
        <h3>👥 सभी रजिस्टर्ड यूजर्स</h3>
        <table>
            <thead>
                <tr>
                    <th>नाम</th>
                    <th>ईमेल</th>
                    <th>वॉलेट बैलेंस</th>
                    <th>रेफरल कोड</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                </tbody>
        </table>
    </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
