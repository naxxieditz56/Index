<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyEarn - Task Zone</title>
    <style>
        :root { --primary-blue: #1e3a8a; --accent-green: #10b981; --bg-dark: #0f172a; --text-light: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .task-card { background: #1e293b; border-radius: 16px; padding: 30px; text-align: center; max-width: 400px; width: 90%; border: 1px solid rgba(16, 185, 129, 0.2); }
        h2 { color: var(--accent-green); margin-bottom: 10px; }
        .btn-claim { background-color: var(--primary-blue); color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .ad-container { display: none; margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; }
        .timer-text { font-size: 18px; color: #f59e0b; font-weight: bold; }
        .ad-box { width: 100%; min-height: 100px; margin-top: 15px; background: #334155; }
    </style>
</head>
<body>

<div class="task-card">
    <h2>क्विज टास्क पूरा हुआ!</h2>
    <p>अपने वॉलेट में ₹10 जोड़ने के लिए नीचे बटन दबाएं।</p>
    <button class="btn-claim" id="claimBtn" onclick="startAdFlow()">रिवॉर्ड क्लेम करें</button>

    <div class="ad-container" id="adSection">
        <p class="timer-text">आपका रिवॉर्ड लोड हो रहा है: <span id="countdown">15</span> सेकंड...</p>
        
        <div class="ad-box">
            <script type="text/javascript">
                atOptions = { 'key' : 'YOUR_ADSTERRA_TASK_KEY', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="//www.highperformanceformat.com/YOUR_ADSTERRA_TASK_KEY/invoke.js"></script>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
<script>
function startAdFlow() {
    document.getElementById('claimBtn').style.display = 'none';
    document.getElementById('adSection').style.display = 'block';

    let timeLeft = 15;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            // वैश्विक ऐप स्क्रिप्ट से रिवॉर्ड फंक्शन को कॉल करें
            window.triggerReward();
        }
    }, 1000);
}
</script>
</body>
</html>
